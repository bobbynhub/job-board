name: Publish job board
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      configure_daily_apify:
        description: Verify the completed test and enable the agreed budget-limited daily Apify task
        type: boolean
        default: false
      apify_run_id:
        description: Optional successful test run used to connect or create the saved task
        type: string
        default: ""
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure daily Apify task
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_daily_apify }}
        run: node scripts/configure-apify.js
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ vars.APIFY_TASK_ID }}
          APIFY_RUN_ID: ${{ inputs.apify_run_id }}
      - name: Collect public company openings
        run: npm run crawl
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ vars.APIFY_TASK_ID }}
          APIFY_DATASET_IDS: ${{ vars.APIFY_DATASET_IDS }}
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
